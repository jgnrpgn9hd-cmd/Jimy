<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts/fonts.css">
<style>
*{margin:0;box-sizing:border-box}
body{width:1800px;background:#EDE7DB;font-family:'Instrument Sans';color:#1F241C;padding:70px}
h1{font-family:'Instrument Serif';font-weight:400;font-size:60px}
.sub{font-size:20px;opacity:.6;margin:6px 0 46px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:34px;margin-bottom:34px}
.card{border-radius:26px;height:600px;padding:36px 24px;display:flex;flex-direction:column;align-items:center;background:#F7F3EA}
.card.g{background:#3F4F24}
.tag{align-self:flex-start;font-size:13px;letter-spacing:.18em;text-transform:uppercase;opacity:.45;margin:0 0 6px 10px}
.g .tag{color:#F7F3EA}
.in{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
svg text{font-family:'Instrument Serif'}
.w{font-family:'Instrument Serif';font-size:50px;letter-spacing:.34em;padding-left:.34em;margin-top:26px;line-height:1}
.b{font-size:11px;letter-spacing:.46em;padding-left:.46em;text-transform:uppercase;margin-top:14px;opacity:.8}
.g .w,.g .b{color:#F7F3EA}
.orn{display:flex;align-items:center;gap:10px;margin-top:16px}.orn i{width:40px;height:1px;background:#A88B57}.orn b{width:5px;height:5px;transform:rotate(45deg);background:#A88B57}
.g .orn i,.g .orn b{background:#C9A86A}
</style></head><body>
<h1>Jimenez — maison</h1><div class="sub">Esprit grande maison : monogramme, couronne d’olivier, or fin sur vert olive et crème.</div>
<div class="row" id="r1"></div><div class="row" id="r2"></div>
<script>
const L=(x,y,rot,s,c)=>`<path transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(1)}) scale(${s})" d="M0 0 C 7 -6.5, 22 -6.5, 30 0 C 22 6.5, 7 6.5, 0 0Z" fill="${c}"/>`;
function wreath(cx,cy,r,a0,a1,n,s,c,w){let o='';const pts=[];for(let side of [1,-1]){let d='';for(let i=0;i<=40;i++){const a=(a0+(a1-a0)*i/40)*Math.PI/180;const x=cx+side*r*Math.cos(a),y=cy+r*Math.sin(a);d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}
o+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}"/>`;
for(let i=1;i<=n;i++){const t=i/(n+.6);const a=(a0+(a1-a0)*t)*Math.PI/180;const x=cx+side*r*Math.cos(a),y=cy+r*Math.sin(a);
const tang=Math.atan2(r*Math.cos(a),-side*r*Math.sin(a))*180/Math.PI; // direction along path
const dir=side==1?Math.atan2(Math.cos(a)*1,-Math.sin(a))*180/Math.PI:Math.atan2(Math.cos(a),Math.sin(a))*180/Math.PI;
const base=Math.atan2(-Math.cos(a)*(side==1?1:1),side==1?Math.sin(a):-Math.sin(a))*180/Math.PI;
o+=L(x,y,base-35,s,c)+L(x,y,base+35,s,c)}
const ae=a1*Math.PI/180;o+=L(cx+side*r*Math.cos(ae),cy+r*Math.sin(ae),Math.atan2(-Math.cos(ae),side==1?Math.sin(ae):-Math.sin(ae))*180/Math.PI,s,c)}
return o}
const P={
A:['Le monogramme couronné',(c1,g)=>`<svg width="260" height="260" viewBox="0 0 260 260">${wreath(130,130,96,100,250,7,.95,g,1.4)}<text x="130" y="168" text-anchor="middle" font-size="120" fill="${c1}">J</text><circle cx="130" cy="232" r="3" fill="${g}"/></svg>`],
B:['Le blason',(c1,g)=>`<svg width="230" height="270" viewBox="0 0 230 270"><path d="M20 22 H210 V140 C210 205 160 240 115 258 C70 240 20 205 20 140Z" fill="none" stroke="${g}" stroke-width="1.8"/><path d="M30 32 H200 V140 C200 198 155 230 115 247 C75 230 30 198 30 140Z" fill="none" stroke="${g}" stroke-width=".8"/>${wreath(115,128,66,105,235,5,.7,g,1.1)}<text x="115" y="158" text-anchor="middle" font-size="96" fill="${c1}">J</text><text x="115" y="58" text-anchor="middle" font-size="12" letter-spacing="5" fill="${g}">ANDALUCÍA</text></svg>`],
C:['Le camée',(c1,g)=>{let dots='';for(let i=0;i<64;i++){const a=i/64*2*Math.PI;dots+=`<circle cx="${(115+92*Math.cos(a)).toFixed(1)}" cy="${(130+112*Math.sin(a)).toFixed(1)}" r="1.6" fill="${g}"/>`}
return `<svg width="230" height="260" viewBox="0 0 230 260"><ellipse cx="115" cy="130" rx="102" ry="122" fill="none" stroke="${g}" stroke-width="1.6"/>${dots}<ellipse cx="115" cy="130" rx="80" ry="100" fill="none" stroke="${g}" stroke-width=".8"/><text x="115" y="166" text-anchor="middle" font-size="128" fill="${c1}">J</text>${L(132,76,-35,.8,g)}${L(132,76,-100,.65,g)}</svg>`}]};
[['#3F4F24','#A88B57',''],['#F7F3EA','#C9A86A','g']].forEach(([c1,g,cls],i)=>{for(const k in P){const [n,f]=P[k];const d=document.createElement('div');d.className='card '+cls;
d.innerHTML=`<div class="tag">${k} — ${n}</div><div class="in">${f(c1,g)}<div class="w">JIMENEZ</div><div class="orn"><i></i><b></b><i></i></div><div class="b">Épicerie fine d’Andalousie</div></div>`;
document.getElementById('r'+(i+1)).appendChild(d)}});
</script></body></html>
