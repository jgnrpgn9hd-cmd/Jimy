<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#f4f9fc}body{width:1600px;height:2050px;font-family:'Inter',sans-serif}</style></head>
<body>
<svg width="1600" height="2050" viewBox="0 0 1600 2050" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- Lettres dessinées sur mesure, traits arrondis (hauteur 100, trait 12) -->
  <g id="L-G"><path d="M74 20 C64 8 52 2 40 2 C18 2 2 22 2 50 C2 78 18 98 42 98 C62 98 76 86 78 64 H46"/></g>
  <g id="L-A"><path d="M2 98 L38 2 L74 98 M17 62 H59"/></g>
  <g id="L-L"><path d="M4 2 V98 H62"/></g>
  <g id="L-B"><path d="M4 2 V98 H42 C62 98 72 86 72 72 C72 58 62 50 44 50 H4 M4 50 H38 C56 50 64 40 64 26 C64 12 56 2 38 2 H4"/></g>
  <g id="L-E"><path d="M66 2 H4 V98 H66 M4 50 H54"/></g>
  <g id="word" fill="none" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <use href="#L-G"/><use href="#L-A" x="104"/><use href="#L-L" x="208"/><use href="#L-B" x="294"/><use href="#L-E" x="396"/>
  </g>
  <!-- Symbole : l'anneau de Pilates, ouvert comme un G, avec ses deux poignées -->
  <g id="mark">
    <path d="M86 30 A50 50 0 1 0 92 74" fill="none" stroke-width="12" stroke-linecap="round"/>
    <path d="M92 74 H64" fill="none" stroke-width="12" stroke-linecap="round"/>
    <rect x="76" y="14" width="22" height="30" rx="8" transform="rotate(40 87 29)" class="grip"/>
    <rect x="-16" y="40" width="22" height="30" rx="8" class="grip"/>
  </g>
  <style>
    .t{font-family:'Inter Display','Inter',sans-serif;font-weight:700;fill:#0e2a3f}
    .s{font-size:18px;fill:#4d6576}
    .lab{font-size:15px;font-weight:700;letter-spacing:3px}
    .hex{font-size:15px;fill:#4d6576;font-family:'JetBrains Mono',monospace}
  </style>
</defs>

<text x="80" y="100" class="t" font-size="44">GALBE · image de marque</text>
<text x="80" y="142" class="s" font-size="20">Kit Pilates « Reformer à la maison » · nom, logo, couleurs, typographie, ton et applications</text>

<!-- 1. LOGO PRINCIPAL -->
<rect x="80" y="180" width="1440" height="440" rx="28" fill="#bfe4f7"/>
<text x="120" y="226" class="lab" fill="#0e2a3f">1 · LOGO PRINCIPAL</text>
<g transform="translate(470 330)" stroke="#0e2a3f" class="markc"><g style="fill:#0e2a3f"><use href="#mark" transform="scale(1.15)"/></g></g>
<g transform="translate(640 340) scale(1.05)" stroke="#0e2a3f"><use href="#word"/></g>
<text x="640" y="500" font-size="22" fill="#0e2a3f" letter-spacing="7" font-family="Inter">LE PILATES À LA MAISON</text>
<text x="120" y="590" class="s" fill="#2c4a5e">Le symbole est l'anneau de Pilates, ouvert comme la lettre G, avec ses deux poignées. Le mot GALBE évoque la silhouette tonique.</text>

<!-- 2. DÉCLINAISONS -->
<text x="80" y="680" class="lab" fill="#0e2a3f">2 · DÉCLINAISONS</text>
<rect x="80" y="700" width="460" height="280" rx="22" fill="#0e2a3f"/>
<g transform="translate(250 780)" stroke="#ffffff"><g style="fill:#ffffff"><use href="#mark" transform="scale(1.2)"/></g></g>
<text x="310" y="955" text-anchor="middle" class="s" fill="#9fc3d8">Icône (profil Instagram, étiquette)</text>
<rect x="570" y="700" width="460" height="280" rx="22" fill="#ffffff" stroke="#d6e9f3" stroke-width="2"/>
<g transform="translate(650 800) scale(.62)" stroke="#0e2a3f"><use href="#word"/></g>
<text x="800" y="955" text-anchor="middle" class="s">Logotype seul (site, boîte)</text>
<rect x="1060" y="700" width="460" height="280" rx="22" fill="#2ef27a"/>
<g transform="translate(1150 790) scale(.7)" stroke="#0e2a3f"><g style="fill:#0e2a3f"><use href="#mark"/></g></g>
<g transform="translate(1260 805) scale(.42)" stroke="#0e2a3f"><use href="#word"/></g>
<text x="1290" y="955" text-anchor="middle" class="s" fill="#0e2a3f">Version horizontale sur vert fluo</text>

<!-- 3. COULEURS -->
<text x="80" y="1050" class="lab" fill="#0e2a3f">3 · COULEURS</text>
<g transform="translate(80 1070)">
  <rect width="270" height="150" rx="18" fill="#bfe4f7"/><text x="0" y="180" class="t" font-size="20">Bleu ciel</text><text x="0" y="205" class="hex">#BFE4F7</text>
  <rect x="292" width="270" height="150" rx="18" fill="#0e2a3f"/><text x="292" y="180" class="t" font-size="20">Bleu nuit (textes)</text><text x="292" y="205" class="hex">#0E2A3F</text>
  <rect x="584" width="270" height="150" rx="18" fill="#2ef27a"/><text x="584" y="180" class="t" font-size="20">Vert fluo (boutons)</text><text x="584" y="205" class="hex">#2EF27A</text>
  <rect x="876" width="270" height="150" rx="18" fill="#ffffff" stroke="#d6e9f3" stroke-width="2"/><text x="876" y="180" class="t" font-size="20">Blanc</text><text x="876" y="205" class="hex">#FFFFFF</text>
  <rect x="1168" width="272" height="150" rx="18" fill="#e8f5fc"/><text x="1168" y="180" class="t" font-size="20">Bleu brume (fonds)</text><text x="1168" y="205" class="hex">#E8F5FC</text>
</g>

<!-- 4. TYPO + TON -->
<text x="80" y="1340" class="lab" fill="#0e2a3f">4 · TYPOGRAPHIE ET TON</text>
<rect x="80" y="1360" width="700" height="250" rx="22" fill="#fff" stroke="#d6e9f3" stroke-width="2"/>
<text x="110" y="1420" font-family="'Inter Display',Inter,sans-serif" font-weight="700" font-size="40" fill="#0e2a3f">Titres : Inter Display</text>
<text x="110" y="1470" font-family="Inter" font-size="22" fill="#0e2a3f">Textes : Inter, simple et lisible sur téléphone.</text>
<text x="110" y="1530" font-family="Inter" font-size="18" fill="#4d6576">Logo : lettres dessinées sur mesure, traits arrondis</text>
<text x="110" y="1560" font-family="Inter" font-size="18" fill="#4d6576">comme un mouvement fluide.</text>
<rect x="820" y="1360" width="700" height="250" rx="22" fill="#fff" stroke="#d6e9f3" stroke-width="2"/>
<text x="850" y="1410" class="t" font-size="22">Le ton de GALBE</text>
<text x="850" y="1450" font-family="Inter" font-size="19" fill="#0e2a3f">Doux, motivant, jamais culpabilisant.</text>
<text x="850" y="1485" font-family="Inter" font-size="19" fill="#0e2a3f">« 15 minutes, ton salon, ton rythme. »</text>
<text x="850" y="1520" font-family="Inter" font-size="19" fill="#0e2a3f">On parle de tonus, de posture, de bien-être,</text>
<text x="850" y="1550" font-family="Inter" font-size="19" fill="#0e2a3f">jamais de promesse médicale ni de kilos perdus.</text>

<!-- 5. APPLICATIONS -->
<text x="80" y="1680" class="lab" fill="#0e2a3f">5 · EN SITUATION</text>
<!-- Boîte du kit -->
<rect x="80" y="1700" width="460" height="320" rx="22" fill="#2ef27a"/>
<g transform="translate(150 1760)">
  <path d="M0 40 L160 0 L320 40 L160 80 Z" fill="#e3f3fc"/>
  <path d="M0 40 L160 80 V200 L0 160 Z" fill="#bfe4f7"/>
  <path d="M320 40 L160 80 V200 L320 160 Z" fill="#a9d6ee"/>
  <g transform="translate(40 105) skewY(14) scale(.18)" stroke="#0e2a3f"><use href="#word"/></g>
  <g transform="translate(236 120) skewY(-14) scale(.28)" stroke="#0e2a3f"><g style="fill:#0e2a3f"><use href="#mark"/></g></g>
</g>
<text x="310" y="2000" text-anchor="middle" class="s" fill="#0e2a3f">Boîte du kit</text>
<!-- Post Instagram -->
<rect x="570" y="1700" width="460" height="320" rx="22" fill="#bfe4f7"/>
<rect x="640" y="1725" width="320" height="250" rx="14" fill="#ffffff"/>
<g transform="translate(660 1745) scale(.3)" stroke="#0e2a3f"><use href="#word"/></g>
<text x="660" y="1830" font-family="'Inter Display',Inter" font-weight="700" font-size="26" fill="#0e2a3f">Le Reformer</text>
<text x="660" y="1862" font-family="'Inter Display',Inter" font-weight="700" font-size="26" fill="#0e2a3f">dans ton salon.</text>
<text x="660" y="1900" font-family="Inter" font-size="15" fill="#4d6576">Programme 30 jours · 15 min/jour</text>
<rect x="660" y="1920" width="140" height="36" rx="18" fill="#2ef27a"/><text x="730" y="1944" text-anchor="middle" font-family="Inter" font-weight="700" font-size="14" fill="#0e2a3f">Je commence</text>
<text x="800" y="2000" text-anchor="middle" class="s" fill="#2c4a5e">Post Instagram</text>
<!-- Étiquette barre -->
<rect x="1060" y="1700" width="460" height="320" rx="22" fill="#0e2a3f"/>
<rect x="1110" y="1830" width="360" height="22" rx="11" fill="#bfe4f7"/>
<rect x="1100" y="1815" width="36" height="52" rx="14" fill="#2ef27a"/><rect x="1444" y="1815" width="36" height="52" rx="14" fill="#2ef27a"/>
<g transform="translate(1235 1834) scale(.11)" stroke="#0e2a3f"><use href="#word"/></g>
<path d="M1150 1867 C1180 1940 1260 1960 1290 1960 C1320 1960 1400 1940 1430 1867" fill="none" stroke="#e3f3fc" stroke-width="5" stroke-linecap="round"/>
<text x="1290" y="2000" text-anchor="middle" class="s" fill="#9fc3d8">Barre et élastique</text>
</svg>
</body></html>
