<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#ffffff}body{width:1600px;height:2050px;font-family:'Inter',sans-serif}</style></head>
<body>
<svg width="1600" height="2050" viewBox="0 0 1600 2050" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- Lettres dessinées sur mesure, traits arrondis (hauteur 100, trait 11) : le V et le A sans barre se répondent -->
  <g id="L-V"><path d="M2 2 L38 98 L74 2"/></g>
  <g id="L-A"><path d="M2 98 L38 2 L74 98"/></g>
  <g id="L-U"><path d="M4 2 V60 C4 84 18 98 38 98 C58 98 72 84 72 60 V2"/></g>
  <g id="L-R"><path d="M4 98 V2 H40 C60 2 70 14 70 30 C70 46 60 58 40 58 H4 M38 58 L70 98"/></g>
  <g id="L-E"><path d="M66 2 H4 V98 H66 M4 50 H54"/></g>
  <g id="word" fill="none" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <use href="#L-V"/><use href="#L-A" x="98"/><use href="#L-U" x="200"/><use href="#L-R" x="300"/><use href="#L-E" x="398"/>
  </g>
  <!-- Symbole : la posture du « teaser » (équilibre assis, buste et jambes levés) qui dessine un V -->
  <g id="mark">
    <path d="M52 96 L98 14" fill="none" stroke-width="13" stroke-linecap="round"/>
    <path d="M52 96 L22 30" fill="none" stroke-width="13" stroke-linecap="round"/>
    <path d="M28 44 L74 16" fill="none" stroke-width="7" stroke-linecap="round"/>
    <circle cx="16" cy="13" r="10" class="grip"/>
  </g>
  <style>
    .t{font-family:'Inter Display','Inter',sans-serif;font-weight:700;fill:#0b1f3a}
    .s{font-size:18px;fill:#55657a}
    .lab{font-size:15px;font-weight:700;letter-spacing:3px}
    .hex{font-size:15px;fill:#55657a;font-family:'JetBrains Mono',monospace}
  </style>
</defs>

<text x="80" y="100" class="t" font-size="44">VAURE · image de marque</text>
<text x="80" y="142" class="s" font-size="20">Kit Pilates « Reformer à la maison » · nom, logo, couleurs, typographie, ton et applications</text>

<!-- 1. LOGO PRINCIPAL -->
<rect x="80" y="180" width="1440" height="440" rx="28" fill="#0b1f3a"/>
<text x="120" y="226" class="lab" fill="#2ef27a">1 · LOGO PRINCIPAL</text>
<g transform="translate(470 330)" stroke="#ffffff" class="markc"><g style="fill:#2ef27a"><use href="#mark" transform="scale(1.15)"/></g></g>
<g transform="translate(640 340) scale(1.05)" stroke="#ffffff"><use href="#word"/></g>
<text x="640" y="500" font-size="22" fill="#2ef27a" letter-spacing="7" font-family="Inter">LE PILATES À LA MAISON</text>
<text x="120" y="590" class="s" style="fill:#b9c6d6">Le symbole est le « teaser », la posture la plus connue du Pilates : en équilibre, buste et jambes levés, le corps dessine le V de VAURE.</text>

<!-- 2. DÉCLINAISONS -->
<text x="80" y="680" class="lab" fill="#0b1f3a">2 · DÉCLINAISONS</text>
<rect x="80" y="700" width="460" height="280" rx="22" fill="#0b1f3a"/>
<g transform="translate(250 780)" stroke="#ffffff"><g style="fill:#ffffff"><use href="#mark" transform="scale(1.2)"/></g></g>
<text x="310" y="955" text-anchor="middle" class="s" style="fill:#b9c6d6">Icône (profil Instagram, étiquette)</text>
<rect x="570" y="700" width="460" height="280" rx="22" fill="#ffffff" stroke="#d9e1ea" stroke-width="2"/>
<g transform="translate(650 800) scale(.62)" stroke="#0b1f3a"><use href="#word"/></g>
<text x="800" y="955" text-anchor="middle" class="s">Logotype seul (site, boîte)</text>
<rect x="1060" y="700" width="460" height="280" rx="22" fill="#2ef27a"/>
<g transform="translate(1150 790) scale(.7)" stroke="#0b1f3a"><g style="fill:#0b1f3a"><use href="#mark"/></g></g>
<g transform="translate(1260 805) scale(.42)" stroke="#0b1f3a"><use href="#word"/></g>
<text x="1290" y="955" text-anchor="middle" class="s" fill="#0b1f3a">Version horizontale sur vert fluo</text>

<!-- 3. COULEURS -->
<text x="80" y="1050" class="lab" fill="#0b1f3a">3 · COULEURS</text>
<g transform="translate(80 1070)">
  <rect width="460" height="150" rx="18" fill="#0b1f3a"/><text x="0" y="180" class="t" font-size="20">Bleu marine (couleur principale, textes)</text><text x="0" y="205" class="hex">#0B1F3A</text>
  <rect x="490" width="460" height="150" rx="18" fill="#ffffff" stroke="#d9e1ea" stroke-width="2"/><text x="490" y="180" class="t" font-size="20">Blanc (fonds)</text><text x="490" y="205" class="hex">#FFFFFF</text>
  <rect x="980" width="460" height="150" rx="18" fill="#2ef27a"/><text x="980" y="180" class="t" font-size="20">Vert fluo (boutons, détails)</text><text x="980" y="205" class="hex">#2EF27A</text>
</g>

<!-- 4. TYPO + TON -->
<text x="80" y="1340" class="lab" fill="#0b1f3a">4 · TYPOGRAPHIE ET TON</text>
<rect x="80" y="1360" width="700" height="250" rx="22" fill="#fff" stroke="#d9e1ea" stroke-width="2"/>
<text x="110" y="1420" font-family="'Inter Display',Inter,sans-serif" font-weight="700" font-size="40" fill="#0b1f3a">Titres : Inter Display</text>
<text x="110" y="1470" font-family="Inter" font-size="22" fill="#0b1f3a">Textes : Inter, simple et lisible sur téléphone.</text>
<text x="110" y="1530" font-family="Inter" font-size="18" fill="#55657a">Logo : lettres dessinées sur mesure, traits arrondis</text>
<text x="110" y="1560" font-family="Inter" font-size="18" fill="#55657a">comme un mouvement fluide.</text>
<rect x="820" y="1360" width="700" height="250" rx="22" fill="#fff" stroke="#d9e1ea" stroke-width="2"/>
<text x="850" y="1410" class="t" font-size="22">Le ton de VAURE</text>
<text x="850" y="1450" font-family="Inter" font-size="19" fill="#0b1f3a">Doux, motivant, jamais culpabilisant.</text>
<text x="850" y="1485" font-family="Inter" font-size="19" fill="#0b1f3a">« 15 minutes, ton salon, ton rythme. »</text>
<text x="850" y="1520" font-family="Inter" font-size="19" fill="#0b1f3a">On parle de tonus, de posture, de bien-être,</text>
<text x="850" y="1550" font-family="Inter" font-size="19" fill="#0b1f3a">jamais de promesse médicale ni de kilos perdus.</text>

<!-- 5. APPLICATIONS -->
<text x="80" y="1680" class="lab" fill="#0b1f3a">5 · EN SITUATION</text>
<!-- Boîte du kit -->
<rect x="80" y="1700" width="460" height="320" rx="22" fill="#2ef27a"/>
<g transform="translate(150 1760)">
  <path d="M0 40 L160 0 L320 40 L160 80 Z" fill="#ffffff"/>
  <path d="M0 40 L160 80 V200 L0 160 Z" fill="#eef2f6"/>
  <path d="M320 40 L160 80 V200 L320 160 Z" fill="#d9e1ea"/>
  <g transform="translate(40 105) skewY(14) scale(.18)" stroke="#0b1f3a"><use href="#word"/></g>
  <g transform="translate(236 120) skewY(-14) scale(.28)" stroke="#0b1f3a"><g style="fill:#0b1f3a"><use href="#mark"/></g></g>
</g>
<text x="310" y="2000" text-anchor="middle" class="s" fill="#0b1f3a">Boîte du kit</text>
<!-- Post Instagram -->
<rect x="570" y="1700" width="460" height="320" rx="22" fill="#0b1f3a"/>
<rect x="640" y="1725" width="320" height="250" rx="14" fill="#ffffff"/>
<g transform="translate(660 1745) scale(.3)" stroke="#0b1f3a"><use href="#word"/></g>
<text x="660" y="1830" font-family="'Inter Display',Inter" font-weight="700" font-size="26" fill="#0b1f3a">Le Reformer</text>
<text x="660" y="1862" font-family="'Inter Display',Inter" font-weight="700" font-size="26" fill="#0b1f3a">dans ton salon.</text>
<text x="660" y="1900" font-family="Inter" font-size="15" fill="#55657a">Programme 30 jours · 15 min/jour</text>
<rect x="660" y="1920" width="140" height="36" rx="18" fill="#2ef27a"/><text x="730" y="1944" text-anchor="middle" font-family="Inter" font-weight="700" font-size="14" fill="#0b1f3a">Je commence</text>
<text x="800" y="2000" text-anchor="middle" class="s" style="fill:#b9c6d6">Post Instagram</text>
<!-- Étiquette barre -->
<rect x="1060" y="1700" width="460" height="320" rx="22" fill="#0b1f3a"/>
<rect x="1110" y="1830" width="360" height="22" rx="11" fill="#ffffff"/>
<rect x="1100" y="1815" width="36" height="52" rx="14" fill="#2ef27a"/><rect x="1444" y="1815" width="36" height="52" rx="14" fill="#2ef27a"/>
<g transform="translate(1235 1834) scale(.11)" stroke="#0b1f3a"><use href="#word"/></g>
<path d="M1150 1867 C1180 1940 1260 1960 1290 1960 C1320 1960 1400 1940 1430 1867" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
<text x="1290" y="2000" text-anchor="middle" class="s" style="fill:#b9c6d6">Barre et élastique</text>
</svg>
</body></html>
