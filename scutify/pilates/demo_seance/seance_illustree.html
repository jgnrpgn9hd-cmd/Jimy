<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VAURE · Séance du jour</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--choco:#552b1d;--ink:#2b1710;--night:#140b08;--cream:#f4ece2;--fluo:#2ef27a;--muted:#7a5a48}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--night);height:100%}
  body{font-family:Inter,system-ui,sans-serif;color:#fbf7f2;display:grid;place-items:center;-webkit-font-smoothing:antialiased}
  .app{width:min(100vw,430px);aspect-ratio:9/16;max-height:100vh;position:relative;overflow:hidden;background:radial-gradient(120% 70% at 50% 62%,#fffaf4 0%,var(--cream) 55%,#e6d7c5 100%);color:var(--ink)}
  .top{position:absolute;left:0;right:0;top:0;padding:18px 20px 0;display:flex;justify-content:space-between;align-items:flex-start;z-index:2}
  .day{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--muted)}
  .day b{color:var(--ink)}
  .logo{height:16px;width:auto}
  .title{position:absolute;left:20px;right:20px;top:58px;z-index:2}
  .title .n{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-style:italic;font-size:15px;color:var(--choco);letter-spacing:.06em}
  .title h1{font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;font-size:38px;line-height:.9;margin:4px 0 6px;letter-spacing:-.005em}
  .title .kit{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
  .title .kit::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--fluo);box-shadow:0 0 0 4px rgba(46,242,122,.25)}
  svg.scene{position:absolute;left:0;right:0;top:20%;width:100%;height:56%}
  .cue{position:absolute;left:0;right:0;bottom:17%;text-align:center;font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;font-size:30px;letter-spacing:.02em;color:var(--ink)}
  .cue span{display:inline-block;transition:opacity .25s ease,transform .25s ease}
  .mode{position:absolute;right:20px;top:66px;z-index:3;display:flex;background:rgba(43,23,16,.08);border-radius:999px;padding:3px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .mode span{padding:6px 9px;border-radius:999px;color:var(--muted)}.mode .on{background:var(--ink);color:#fbf7f2}
  .prep{position:absolute;left:14px;right:14px;bottom:14px;z-index:4;background:var(--night);color:#fbf7f2;border-radius:22px;padding:18px 18px 16px;transform:translateY(115%);transition:transform .5s cubic-bezier(.2,.9,.25,1)}
  .app.intro .prep{transform:none}
  .app.intro .bottom,.app.intro .cue{opacity:0}
  .app.intro svg.scene{top:13%}
  svg.scene{transition:top .5s cubic-bezier(.2,.9,.25,1)}
  .ph{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .pk{font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--fluo)}
  .pn{font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;font-size:28px;line-height:.95;margin-top:4px}
  .pic{width:64px;height:64px;flex:none;background:#2b1710;border-radius:16px}
  .prep ol{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:9px;counter-reset:s}
  .prep li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.35;color:#dcc7b4;opacity:0;transform:translateY(8px);transition:opacity .4s ease,transform .4s ease}
  .prep li.on{opacity:1;transform:none;color:#fbf7f2}
  .prep li::before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--fluo);color:var(--ink);font-weight:800;font-size:12px;display:grid;place-items:center}
  .pf{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12)}
  .cd{display:flex;align-items:baseline;gap:8px}.cd b{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:34px;color:var(--fluo);line-height:1}.cd span{font-size:11px;color:#9c8576;text-transform:uppercase;letter-spacing:.12em;font-weight:700}
  .go{all:unset;background:var(--fluo);color:var(--ink);font-weight:700;font-size:14px;padding:12px 16px;border-radius:999px}
  .bottom,.cue{transition:opacity .3s ease}
  .segs{position:absolute;left:20px;right:20px;top:46px;display:flex;gap:5px;z-index:3}
  .segs i{flex:1;height:5px;background:rgba(43,23,16,.14);border-radius:3px;overflow:hidden}
  .segs b{display:block;height:100%;background:var(--choco);transform-origin:left;transform:scaleX(0)}
  .title{top:66px!important}
  .title h1{max-width:62%}
  .bottom{position:absolute;left:14px;right:14px;bottom:16px;height:84px;display:flex;align-items:stretch;background:#fff;border-radius:20px;box-shadow:0 12px 34px rgba(43,23,16,.16);overflow:hidden}
  .repbox{background:var(--choco);color:#fbf7f2;padding:0 34px 0 22px;display:flex;align-items:center;gap:6px;clip-path:polygon(0 0,100% 0,84% 100%,0 100%);min-width:52%}
  .repbox span{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:58px;line-height:1;color:var(--fluo);font-variant-numeric:tabular-nums}
  .repbox small{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:28px;color:#dcc7b4}
  .side{flex:1;display:flex;flex-direction:column;justify-content:center;padding-left:4px}
  .side .time{color:var(--ink);font-size:26px}.side .lbl{color:var(--muted)}
  .pause{all:unset;width:84px;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer}
  .pause i{width:8px;height:30px;border-radius:3px;background:var(--ink)}
  .row{display:flex;justify-content:space-between;align-items:baseline}
  .reps{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:44px;line-height:1}
  .reps i{font-style:normal;font-size:16px;color:#9c8576;margin-left:4px}
  .time{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-style:italic;font-size:28px;color:var(--fluo);font-variant-numeric:tabular-nums}
  .lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:#9c8576;margin-top:2px}
  .bar{height:6px;background:rgba(255,255,255,.1);margin-top:12px;transform:skewX(-18deg);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--fluo);transform-origin:left}
  .steps{display:flex;gap:6px;margin-top:12px}
  .steps span{flex:1;font-size:10px;color:#9c8576;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border-top:3px solid rgba(255,255,255,.12);padding-top:6px}
  .steps span.on{color:#fbf7f2;border-color:var(--fluo)}
  .steps span.done{border-color:#6b4a3a}
</style></head>
<body>
<div class="app">
  <div class="top">
    <div class="day">Jour 15 · <b>Bas du corps</b></div>
    <svg class="logo" viewBox="0 -6 616 112" aria-label="VAURE"><g fill="none" stroke="#2b1710" stroke-linecap="round"><path d="M52 96 L98 14" stroke-width="13"/><path d="M52 96 L22 30" stroke-width="13"/><path d="M28 44 L74 16" stroke-width="7"/></g><circle cx="16" cy="13" r="10" fill="#2ef27a"/><g transform="translate(140 0)" fill="none" stroke="#2b1710" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2 L38 98 L74 2"/><path transform="translate(98 0)" d="M2 98 L38 2 L74 98"/><path transform="translate(200 0)" d="M4 2 V60 C4 84 18 98 38 98 C58 98 72 84 72 60 V2"/><path transform="translate(300 0)" d="M4 98 V2 H40 C60 2 70 14 70 30 C70 46 60 58 40 58 H4 M38 58 L70 98"/><path transform="translate(398 0)" d="M66 2 H4 V98 H66 M4 50 H54"/></g></svg>
  </div>
  <div class="title"><div class="n" id="num">EXERCICE 1 / 3</div><h1 id="name">Pont fessier</h1><div class="kit" id="kit">Avec la bande moyenne</div></div>

  <svg class="scene" viewBox="140 -400 600 440" preserveAspectRatio="xMidYMid meet">
    <defs>
      <radialGradient id="glow"><stop offset="0" stop-color="#2ef27a" stop-opacity=".35"/><stop offset="1" stop-color="#2ef27a" stop-opacity="0"/></radialGradient>
      <linearGradient id="matg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#6a3726"/><stop offset="1" stop-color="#43211a"/></linearGradient>
    </defs>
    <ellipse cx="420" cy="18" rx="330" ry="22" fill="#2b1710" opacity=".10"/>
    <rect x="130" y="-2" width="580" height="14" rx="7" fill="url(#matg)"/>
    <circle id="hl" cx="0" cy="0" r="90" fill="url(#glow)"/>
    <g id="kitBack"></g>
    <g id="body" fill="none" stroke-linecap="round" stroke-linejoin="round"></g>
    <g id="kitFront"></g>
    <g id="arw" fill="none" stroke="#2ef27a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity=".9"></g>
  </svg>

  <div class="cue"><span id="cue">Inspire</span></div>
  <div class="mode"><span class="on">Minuteur</span><span>À ton rythme</span></div>
  <div class="prep" id="prep">
    <div class="ph"><div><div class="pk">Prépare ton matériel</div><div class="pn" id="pname">La bande moyenne</div></div><svg class="pic" id="picon" viewBox="0 0 80 80"></svg></div>
    <ol id="psteps"></ol>
    <div class="pf"><div class="cd"><b id="cd">6</b><span>Ça commence</span></div><button class="go">Je suis prête →</button></div>
  </div>

  <div class="segs"><i><b id="g0"></b></i><i><b id="g1"></b></i><i><b id="g2"></b></i></div>
  <div class="bottom">
    <div class="repbox"><span id="reps">1</span><small id="repn">/ 10</small></div>
    <div class="side"><div class="time" id="time">00:40</div><div class="lbl">Restant</div></div>
    <button class="pause" aria-label="Pause"><i></i><i></i></button>
  </div>
</div>

<script>
/* Silhouette VAURE : membres épais à bouts ronds, même esprit que le symbole du logo.
   Les mouvements sont calculés (cinématique) pour rester crédibles : les pieds restent posés, les genoux plient dans le bon sens. */
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id);
const L={torso:150,thigh:122,shin:116,upper:86,fore:80,neck:20,head:27};
const C={body:'#2b1710',far:'#7a5a48',band:'#997b63',slider:'#4e2719'};
const ease=t=>.5-.5*Math.cos(Math.PI*t);
const lerp=(a,b,t)=>a+(b-a)*t, P=(x,y)=>({x,y}), mix=(a,b,t)=>P(lerp(a.x,b.x,t),lerp(a.y,b.y,t));
function ik(A,Cc,l1,l2,pick){const dx=Cc.x-A.x,dy=Cc.y-A.y;let d=Math.hypot(dx,dy);d=Math.min(d,l1+l2-.5);
  const a=Math.acos((l1*l1+d*d-l2*l2)/(2*l1*d)),th=Math.atan2(dy,dx);
  const k1=P(A.x+l1*Math.cos(th+a),A.y+l1*Math.sin(th+a)),k2=P(A.x+l1*Math.cos(th-a),A.y+l1*Math.sin(th-a));return pick(k1,k2);}
const along=(a,b,len)=>{const d=Math.hypot(b.x-a.x,b.y-a.y);return P(a.x+(b.x-a.x)/d*len,a.y+(b.y-a.y)/d*len)};
function line(g,a,b,w,col){const l=document.createElementNS(NS,'line');l.setAttribute('x1',a.x.toFixed(1));l.setAttribute('y1',a.y.toFixed(1));l.setAttribute('x2',b.x.toFixed(1));l.setAttribute('y2',b.y.toFixed(1));l.setAttribute('stroke',col);l.setAttribute('stroke-width',w);g.appendChild(l);}
function circ(g,c,r,fill){const e=document.createElementNS(NS,'circle');e.setAttribute('cx',c.x.toFixed(1));e.setAttribute('cy',c.y.toFixed(1));e.setAttribute('r',r);e.setAttribute('fill',fill);g.appendChild(e);}
function raw(g,html){g.insertAdjacentHTML('beforeend',html);}
const SK='#d8a07a',SKD='#b98463',HAIR='#3a2318',LEG='#552b1d',LEGD='#3a1d14',TOP='#2ef27a',SOCK='#f4ece2';
function poly(g,pts,fill){const p=document.createElementNS(NS,'polygon');p.setAttribute('points',pts.map(q=>q.x.toFixed(1)+','+q.y.toFixed(1)).join(' '));p.setAttribute('fill',fill);g.appendChild(p);}
/* membre effilé : largeur w1 au départ, w2 à l'arrivée, bouts arrondis */
function limb(g,a,b,w1,w2,col){const d=Math.hypot(b.x-a.x,b.y-a.y)||1,nx=-(b.y-a.y)/d,ny=(b.x-a.x)/d;
  poly(g,[P(a.x+nx*w1/2,a.y+ny*w1/2),P(b.x+nx*w2/2,b.y+ny*w2/2),P(b.x-nx*w2/2,b.y-ny*w2/2),P(a.x-nx*w1/2,a.y-ny*w1/2)],col);
  circ(g,a,w1/2,col);circ(g,b,w2/2,col);}
function drawBody(S){const g=$('body');g.innerHTML='';
  const d=P((S.sh.x-S.hip.x)/L.torso,(S.sh.y-S.hip.y)/L.torso);let n=P(-d.y,d.x);if(n.x*S.front.x+n.y*S.front.y<0)n=P(-n.x,-n.y);
  const at=(t,off=0)=>P(S.hip.x+(S.sh.x-S.hip.x)*t+n.x*off,S.hip.y+(S.sh.y-S.hip.y)*t+n.y*off);
  /* côté éloigné */
  if(S.farArm){limb(g,S.sh,S.farArm.e,17,14,SKD);limb(g,S.farArm.e,S.farArm.h,14,11,SKD);}
  if(S.farLeg){limb(g,S.hip,S.farLeg.k,36,24,LEGD);limb(g,S.farLeg.k,S.farLeg.a,24,15,LEGD);limb(g,S.farLeg.a,S.farLeg.f,13,10,'#dcc7b4');}
  /* jambe proche : legging chocolat, chaussette crème */
  limb(g,S.hip,S.knee,40,26,LEG);limb(g,S.knee,S.ank,26,16,LEG);limb(g,S.ank,S.foot,14,10,SOCK);
  circ(g,at(.02,-14),25,LEG);                                         // fessier
  /* buste : taille de legging, ventre, brassière vert fluo */
  limb(g,at(0),at(.2),52,46,LEG);limb(g,at(.2),at(.5),44,40,SK);limb(g,at(.5),at(.86),46,48,TOP);
  circ(g,at(.66,14),15,TOP);                                          // poitrine
  limb(g,at(.86),S.sh,40,30,SK);
  /* tête : cou, visage, cheveux, queue de cheval */
  const hdir=S.headDir||d;let hn=P(-hdir.y,hdir.x);if(hn.x*S.front.x+hn.y*S.front.y<0)hn=P(-hn.x,-hn.y);
  const nk=P(S.sh.x+hdir.x*L.neck,S.sh.y+hdir.y*L.neck),hd=P(S.sh.x+hdir.x*(L.neck+L.head-6),S.sh.y+hdir.y*(L.neck+L.head-6));
  {const d=hdir,n=hn;
  limb(g,S.sh,nk,15,13,SK);
  circ(g,P(hd.x-n.x*5,hd.y-n.y*5),L.head+1,HAIR);
  circ(g,P(hd.x+n.x*4,hd.y+n.y*4),L.head-4,SK);
  circ(g,P(hd.x+n.x*(L.head-2)+d.x*2,hd.y+n.y*(L.head-2)+d.y*2),4,SK);   // nez
  const pt=P(hd.x-n.x*(L.head+6)+d.x*10,hd.y-n.y*(L.head+6)+d.y*10);
  limb(g,P(hd.x-n.x*16+d.x*14,hd.y-n.y*16+d.y*14),pt,14,18,HAIR);circ(g,P(pt.x-n.x*6-d.x*14,pt.y-n.y*6-d.y*14),9,HAIR);
  circ(g,P(hd.x-n.x*14+d.x*18,hd.y-n.y*14+d.y*18),5,TOP);            // élastique fluo
  }
  /* bras proche */
  limb(g,S.sh,S.elb,19,15,SK);limb(g,S.elb,S.hand,15,11,SK);
}
/* ---------- Exercice 1 : pont fessier avec bande ---------- */
function bridge(t){const up=ease(t);
  const sh=P(250,-27),ank=P(545,-16),foot=P(578,-11);
  const hip=P(lerp(392,402,up),lerp(-27,-142,up));
  const knee=ik(hip,ank,L.thigh,L.shin,(a,b)=>a.y<b.y?a:b);
  const hand=P(400,-12),elb=P(325,-16);
  const kb=$('kitBack'),kf=$('kitFront');kb.innerHTML='';kf.innerHTML='';
  const bp=mix(hip,knee,.78),ang=Math.atan2(knee.y-hip.y,knee.x-hip.x)*180/Math.PI;   // bande au-dessus des genoux
  raw(kf,`<rect x="${(bp.x-15).toFixed(1)}" y="${(bp.y-24).toFixed(1)}" width="30" height="48" rx="9" fill="${C.band}" transform="rotate(${(ang+90).toFixed(1)} ${bp.x.toFixed(1)} ${bp.y.toFixed(1)})"/>`);
  return {S:{sh,hip,knee,ank,foot,elb,hand,front:P(0,-1),headDir:P(-1,.08),farLeg:{k:P(knee.x-6,knee.y+4),a:P(ank.x-8,ank.y),f:P(foot.x-8,foot.y)}},hl:mix(hip,knee,.25),arrow:{at:P(hip.x+70,hip.y-30),dir:-1}};}

/* ---------- Exercice 2 : squat avec bande ---------- */
function squat(t){const d=ease(t);
  const ank=P(470,-14),foot=P(506,-9);
  const hip=P(lerp(452,372,d),lerp(-236,-128,d));
  const knee=ik(hip,ank,L.thigh,L.shin,(a,b)=>a.x>b.x?a:b);
  const lean=lerp(4,42,d)*Math.PI/180;                                   // buste qui se penche vers l'avant
  const sh=P(hip.x+L.torso*Math.sin(lean),hip.y-L.torso*Math.cos(lean));
  const reach=lerp(.15,1,d);                                               // bras vers l'avant pour l'équilibre
  const elb=P(sh.x+L.upper*lerp(.15,.98,reach),sh.y+L.upper*lerp(.98,.2,reach));
  const hand=P(elb.x+L.fore*lerp(.1,1,reach),elb.y+L.fore*lerp(.99,.05,reach));
  const kb=$('kitBack'),kf=$('kitFront');kb.innerHTML='';kf.innerHTML='';
  const BANDF='#534032';const bp=mix(hip,knee,.8),ang=Math.atan2(knee.y-hip.y,knee.x-hip.x)*180/Math.PI;
  raw(kf,`<rect x="${(bp.x-15).toFixed(1)}" y="${(bp.y-24).toFixed(1)}" width="30" height="48" rx="9" fill="${BANDF}" transform="rotate(${(ang+90).toFixed(1)} ${bp.x.toFixed(1)} ${bp.y.toFixed(1)})"/>`);
  return {S:{sh,hip,knee,ank,foot,elb,hand,front:P(1,0),farArm:{e:P(elb.x-10,elb.y+4),h:P(hand.x-10,hand.y+4)},farLeg:{k:P(knee.x-12,knee.y+3),a:P(ank.x-14,ank.y),f:P(foot.x-14,foot.y)}},hl:mix(hip,knee,.3),arrow:{at:P(hip.x-80,hip.y-20),dir:1}};}

/* ---------- Exercice 3 : genoux vers la poitrine, pieds sur les sliders ---------- */
function tuck(t){const k=ease(t);
  const hand=P(292,-12),sh=P(300,-142);
  const ank=P(lerp(678,486,k),-24),foot=P(ank.x+30,-18);
  const hip=P(lerp(455,430,k),lerp(-120,-172,k));
  const knee=ik(hip,ank,L.thigh,L.shin,(a,b)=>a.y>b.y?a:b);
  const elb=mix(sh,hand,.5);elb.x+=3;
  const kb=$('kitBack'),kf=$('kitFront');kb.innerHTML='';kf.innerHTML='';
  raw(kb,`<ellipse cx="${(ank.x+14).toFixed(1)}" cy="-6" rx="40" ry="8" fill="${C.slider}"/><ellipse cx="${(ank.x+14).toFixed(1)}" cy="-9" rx="40" ry="7" fill="#6e3a27"/>`);
  return {S:{sh,hip,knee,ank,foot,elb,hand,front:P(0,1),farArm:{e:P(elb.x-12,elb.y),h:P(hand.x-14,hand.y)},farLeg:{k:P(knee.x-8,knee.y-4),a:P(ank.x-10,ank.y-2),f:P(foot.x-10,foot.y-2)}},hl:mix(sh,hip,.5),arrow:{at:P(ank.x+90,-70),dir:0}};}

const EX=[
  {f:bridge,name:'Pont fessier',kit:'Avec la bande moyenne',acc:'La bande moyenne',icon:'band:#997b63',
   steps:['Prends la bande moyenne, la taupe.','Enfile-la au-dessus des genoux, bien à plat, sans la vriller.','Allonge-toi sur le dos, pieds à plat, écartés de la largeur des hanches.','Pendant tout l\'exercice, pousse doucement les genoux vers l\'extérieur.'],n:10,period:3.2,cues:['Expire, monte le bassin','Inspire, redescends']},
  {f:squat,name:'Squat avec bande',kit:'Avec la bande forte',acc:'La bande forte',icon:'band:#534032',
   steps:['Change de bande : prends la forte, la marron foncé.','Place-la au-dessus des genoux.','Debout, pieds écartés de la largeur des épaules.','Garde les genoux dans l\'axe des pieds en descendant.'],n:10,period:3.4,cues:['Inspire, descends','Expire, pousse dans les talons']},
  {f:tuck,name:'Genoux à la poitrine',kit:'Avec les 2 sliders',acc:'Les 2 sliders',icon:'sliders',
   steps:['Enlève la bande et pose les 2 sliders à plat sur le tapis.','Mets la pointe de chaque pied sur un slider.','Mains sous les épaules, corps droit comme une planche.','Garde le ventre serré : le dos ne doit pas creuser.'],n:10,period:3.0,cues:['Expire, ramène les genoux','Inspire, repousse']}];
const PER=13,INTRO=7,SEG=PER+INTRO; /* préparation puis exercice */

const ICON={
  'sliders':'<ellipse cx="40" cy="30" rx="26" ry="8" fill="#4e2719"/><ellipse cx="40" cy="27" rx="26" ry="7" fill="#6e3a27"/><ellipse cx="40" cy="55" rx="26" ry="8" fill="#4e2719"/><ellipse cx="40" cy="52" rx="26" ry="7" fill="#6e3a27"/>'};
function bandIcon(c){return '<rect x="14" y="20" width="52" height="40" rx="14" fill="none" stroke="'+c+'" stroke-width="12"/>';}
let lastIdx=-1,lastStep=-1;
function render(T){
  const idx=Math.floor(T/SEG)%EX.length,e=EX[idx],st=T%SEG,intro=st<INTRO,lt=Math.max(0,st-INTRO);
  document.querySelector('.app').classList.toggle('intro',intro);
  if(idx!==lastIdx){lastIdx=idx;$('pname').textContent=e.acc;
    $('picon').innerHTML=e.icon.startsWith('band')?bandIcon(e.icon.split(':')[1]):ICON[e.icon];
    $('psteps').innerHTML=e.steps.map(x=>'<li>'+x+'</li>').join('');lastStep=-1;}
  $('num').textContent='EXERCICE '+(idx+1)+' / 3';$('name').textContent=e.name;$('kit').textContent=e.kit;
  if(intro){
    const r=e.f(0);drawBody(r.S);
    const lis=$('psteps').children,k=Math.min(lis.length,Math.floor(st/1.2)+1);for(let i=0;i<lis.length;i++)lis[i].classList.toggle('on',i<k);
    $('cd').textContent=Math.max(1,Math.ceil(INTRO-st));
    /* le matériel s'allume sur l'illustration */
    const pulse=.55+.45*Math.sin(st*4);$('kitFront').setAttribute('opacity',1);$('kitBack').setAttribute('opacity',1);
    const kp=e.icon==='sliders'?P(r.S.ank.x+14,-8):mix(r.S.hip,r.S.knee,.78);
    $('hl').setAttribute('cx',kp.x.toFixed(1));$('hl').setAttribute('cy',kp.y.toFixed(1));$('hl').setAttribute('opacity',pulse.toFixed(2));
    $('arw').innerHTML='';
    for(let i=0;i<3;i++)$('g'+i).style.transform='scaleX('+(i<idx?1:0)+')';
    $('reps').textContent='0';$('repn').textContent='/ '+e.n;$('time').textContent='00:40';
    return;}
  const ph=(lt%e.period)/e.period, tri=ph<.5?ph*2:2-ph*2;
  const r=e.f(tri);drawBody(r.S);
  const A=r.arrow,g=$('arw');let up=ph<.5;let dx=0,dy=0;
  if(A.dir===-1)dy=up?-1:1; else if(A.dir===1)dy=up?1:-1; else dx=up?-1:1;
  const s0=P(A.at.x-dx*34-dy*14,A.at.y-dy*34+dx*14),s1=P(A.at.x+dx*34-dy*14,A.at.y+dy*34+dx*14),c=P(A.at.x+dy*18,A.at.y-dx*18);
  const hx=s1.x,hy=s1.y,ux=dx||0,uy=dy||0;
  g.innerHTML='<path d="M'+s0.x.toFixed(1)+' '+s0.y.toFixed(1)+' Q'+c.x.toFixed(1)+' '+c.y.toFixed(1)+' '+hx.toFixed(1)+' '+hy.toFixed(1)+'"/>'+
    '<path d="M'+(hx-uy*14-ux*16).toFixed(1)+' '+(hy+ux*14-uy*16).toFixed(1)+' L'+hx.toFixed(1)+' '+hy.toFixed(1)+' L'+(hx+uy*14-ux*16).toFixed(1)+' '+(hy-ux*14-uy*16).toFixed(1)+'"/>';
  g.setAttribute('opacity',(.35+.6*Math.sin(Math.PI*((ph*2)%1))).toFixed(2));
  $('hl').setAttribute('cx',r.hl.x.toFixed(1));$('hl').setAttribute('cy',r.hl.y.toFixed(1));$('hl').setAttribute('opacity',(.55+.45*tri).toFixed(2));
  const cue=$('cue');const ct=ph<.5?e.cues[0]:e.cues[1];if(cue.textContent!==ct)cue.textContent=ct;
  $('reps').textContent=Math.min(e.n,Math.floor(lt/e.period)+1);$('repn').textContent='/ '+e.n;
  for(let i=0;i<3;i++)$('g'+i).style.transform='scaleX('+(i<idx?1:i===idx?(lt/PER).toFixed(3):0)+')';
  const rest=Math.max(0,40-Math.floor(lt*40/PER));$('time').textContent='00:'+String(rest).padStart(2,'0');
}
let t0=null;
if(window.__frame===undefined){(function loop(now){if(t0===null)t0=now;render((now-t0)/1000);requestAnimationFrame(loop);})(performance.now());}
window.renderAt=render;
</script>
</body></html>
