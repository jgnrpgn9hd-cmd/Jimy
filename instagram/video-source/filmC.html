<!doctype html><html lang="fr"><head><meta charset="utf-8"><link href="fonts/fonts.css" rel="stylesheet"><style>
:root{--cream:#F6F1E7;--ink:#1F241C;--olive:#4B523C;--gold:#A88B57;--gold2:#C9AE7C}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#ECE8D8}
body{font-family:"Instrument Sans",sans-serif;color:var(--ink)}
.L{position:absolute;inset:0;overflow:hidden;display:none}
.serif{font-family:"Instrument Serif",serif;font-weight:400;letter-spacing:-1px}
.k{font-size:24px;letter-spacing:8px;text-transform:uppercase;font-weight:500}
.ch{display:inline-block}
.cap{position:absolute;left:0;right:0;text-align:center}
.im{position:absolute;object-fit:cover}
#grain{position:absolute;left:-60px;top:-60px;opacity:.05;mix-blend-mode:multiply;z-index:100;pointer-events:none}
</style></head><body>
<svg id="grain" width="1200" height="2040"><filter id="n"><feTurbulence id="turb" type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="1"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div class="L" id="intro" style="background:#ECE8D8">
  <div class="cap serif" style="top:880px;font-size:96px"><span id="iw"></span>
  <svg id="wv" width="420" height="24" style="display:block;margin:6px auto 0"><path id="wvP" stroke="#A88B57" stroke-width="2.5" fill="none"/></svg></div></div>
<div id="scenes"></div>
<div class="L" id="end" style="background:#ECE8D8;align-items:center;justify-content:center;flex-direction:column">
  <img id="lg" src="img/logo_ink.png" style="width:440px">
  <div id="e2" class="k" style="margin-top:44px;color:var(--olive);font-size:28px">jimenez-shop.com</div></div>
<div id="lineW" style="position:absolute;z-index:90;top:0;height:1920px;width:3px;background:#C9AE7C;display:none"></div>
<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),4), eio=t=>{t=clamp(t);return t<.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2};
const es=t=>{t=clamp(t);return t*t*(3-2*t)}; const prog=(t,a,b)=>clamp((t-a)/(b-a)); const $=id=>document.getElementById(id);
// id, img, bg, box[x,y,w,h], objpos, fade mask?, card?, kicker, title, textTop, inType
const S=[
 ['cou','n_coupage.jpg','#FFFFFF',[-280,470,1640,1535],'50% 50%',true,false,'Picual & Arbequina','Coupage.',250,'circle'],
 ['tri','n_trio.jpg','#FCF3F3',[0,0,1080,1340],'50% 50%',true,false,'Hojiblanca · Arbosana · Picual','Trois variétés.',1470,'fade'],
 ['eco','n_eco.jpg','#D6D2D2',[-500,560,1740,1134],'50% 50%',true,false,'Arbequina','Écologique.',250,'wipe'],
 ['tin','n_tins.jpg','#ECE8D8',[180,530,720,1120],'50% 50%',false,true,'Arbequina · Pressée à froid','Le grand format.',230,'fade'],
 ['cer','n_ceramic.jpg','#ECDCC6',[0,560,1080,1278],'50% 30%',true,false,'Arbequina','À offrir.',250,'fade'],
];
const DUR=2.5, T0=2.9; const DURATION=T0+S.length*DUR+2.6;
S.forEach(([id,img,bg,b,op,fade,card,k,tt,top],i)=>{const d=document.createElement('div');d.className='L';d.id=id;d.style.background=bg;d.style.zIndex=10+i;
 d.innerHTML=`<img class="im" src="hq/${img}" style="left:${b[0]}px;top:${b[1]}px;width:${b[2]}px;height:${b[3]}px;object-position:${op};${fade?'-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 12%,#000 90%,transparent 100%);':''}${card?'border-radius:30px;box-shadow:0 40px 90px rgba(31,36,28,.25);':''}">
 <div class="cap k" style="top:${top}px;color:var(--gold)">${k}</div><div class="cap serif" style="top:${top+58}px;font-size:110px"><span></span></div>`;
 $('scenes').appendChild(d);});
function word(el,w,t,st,en){ if(el.dataset.w!==w){el.dataset.w=w;el.innerHTML='';[...w].forEach(c=>{const s=document.createElement('span');s.className='ch';s.textContent=c===' '?' ':c;el.appendChild(s)})}
 [...el.children].forEach((c,i)=>{const p=eo(prog(t,st+i*.035,st+.8+i*.035)), q=en?eo(prog(t,en+i*.015,en+.45+i*.015)):0;
  c.style.opacity=p*(1-q); c.style.transform=`translateY(${(1-p)*30-q*20}px)`; c.style.filter=`blur(${(1-p)*10+q*10}px)`;});}
function render(t){
  const f=Math.floor(t*24); $('turb').setAttribute('seed',f%97); $('grain').style.transform=`translate(${(f*37)%60-30}px,${(f*53)%60-30}px)`;
  $('lineW').style.display='none';
  $('intro').style.display=t<T0+.8?'block':'none';
  if(t<T0+.8){const W=[['Une bouteille.',.15,1.05],['Un geste.',1.35,2.05],['Un goût.',2.3,null]]; let cur=W[0]; for(const w of W) if(t>=w[1]-.05) cur=w;
    word($('iw'),cur[0],t,cur[1],cur[2]);
    let d='';for(let x=0;x<=420;x+=6)d+=(x?' L':'M')+x+' '+(12+Math.sin(x/16+t*5)*5).toFixed(1); $('wvP').setAttribute('d',d);
    $('wv').style.clipPath=`inset(0 ${(1-eo(prog(t,.3,1.1)))*100}% 0 0)`;}
  S.forEach(([id,,,,,,,k,tt,top,inT],i)=>{const st=T0+i*DUR, en=st+DUR, el=$(id); const on=t>=st&&t<en+.8; el.style.display=on?'block':'none'; if(!on)return;
    const p=eio(prog(t,st,st+.8));
    el.style.clipPath='none'; el.style.opacity=1; el.style.filter='none';
    if(inT==='circle') el.style.clipPath=`circle(${p*120}% at 50% 50%)`;
    else if(inT==='wipe'){el.style.clipPath=`inset(0 0 0 ${(1-p)*100}%)`; if(p>0&&p<1){const l=$('lineW').style;l.display='block';l.left=((1-p)*1080-1)+'px';}}
    else {el.style.opacity=p; el.style.filter=p<1?`blur(${(1-p)*14}px)`:'none';}
    el.querySelector('.im').style.transform=`scale(${lerp(1.1,1.0,es(prog(t,st,en+.8)))})`;
    el.querySelector('.k').style.opacity=eo(prog(t,st+.5,st+1.1))*(1-eo(prog(t,en-.3,en+.1)));
    word(el.querySelector('.serif span'),tt,t,st+.55,en-.35);});
  const eOn=t>=T0+S.length*DUR; $('end').style.display=eOn?'flex':'none'; $('end').style.zIndex=50;
  if(eOn){const s=T0+S.length*DUR; $('end').style.clipPath=`circle(${eio(prog(t,s,s+.7))*120}% at 50% 50%)`;
    $('lg').style.clipPath=`inset(-10% ${(1-eio(prog(t,s+.4,s+1.3)))*100}% -10% 0)`;
    const q=eo(prog(t,s+1.1,s+1.6)); $('e2').style.opacity=q; $('e2').style.transform=`translateY(${(1-q)*16}px)`;}
}
window.render=render; window.DURATION=DURATION; render(0);
</script></body></html>
