<!doctype html><html lang="fr"><head><meta charset="utf-8"><link href="fonts/fonts.css" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#ECE8D8}
body{font-family:"Instrument Sans",sans-serif;color:#1F241C}
.serif{font-family:"Instrument Serif",serif;font-weight:400;letter-spacing:-.02em;line-height:.98}
.ch{display:inline-block}
.cap{position:absolute;left:0;right:0;text-align:center}
.card{position:absolute;left:540px;top:1080px;width:520px;height:700px;margin:-350px 0 0 -260px;border-radius:28px;overflow:hidden;box-shadow:0 40px 80px rgba(31,36,28,.28);background:#fff}
.card img{width:100%;height:100%;object-fit:cover}
.k{font-size:24px;letter-spacing:8px;text-transform:uppercase;font-weight:500;color:#A88B57}
#grain{position:absolute;left:-60px;top:-60px;opacity:.05;mix-blend-mode:multiply;z-index:100;pointer-events:none}
</style></head><body>
<svg id="grain" width="1200" height="2040"><filter id="n"><feTurbulence id="turb" type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="1"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div class="cap serif" id="l1" style="top:780px;font-size:110px"></div>
<div class="cap serif" id="l2" style="top:900px;font-size:110px;color:#4B523C"></div>
<div class="cap k" id="kk" style="top:250px"></div>
<div class="cap serif" id="t1" style="top:300px;font-size:104px"></div>
<div id="cards"></div>
<div id="end" style="position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#1B2619;color:#F6F1E7">
  <img id="lg" src="img/logo_cream.png" style="width:440px">
  <div id="u1" style="margin-top:50px;font-size:56px;font-weight:600;letter-spacing:-1px">jimenez-shop.com</div>
  <div id="u2" style="margin-top:16px;font-size:36px;color:#C9AE7C">@jimenez_shop_fr</div>
  <div id="u3" style="margin-top:110px;font-size:26px;letter-spacing:8px;text-transform:uppercase;color:#E6DDCE">Commande en ligne · Livraison en France</div>
</div>
<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),4), eio=t=>{t=clamp(t);return t<.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2};
const eb=t=>{t=clamp(t);const c1=1.4,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const prog=(t,a,b)=>clamp((t-a)/(b-a)); const $=id=>document.getElementById(id);
const DURATION=13.0;
function word(el,w,t,st,en){ if(el.dataset.w!==w){el.dataset.w=w;el.innerHTML='';[...w].forEach(c=>{const s=document.createElement('span');s.className='ch';s.textContent=c===' '?' ':c;el.appendChild(s)})}
 [...el.children].forEach((c,i)=>{const p=eo(prog(t,st+i*.03,st+.7+i*.03)), q=en?eo(prog(t,en+i*.012,en+.4+i*.012)):0;
  c.style.opacity=p*(1-q); c.style.transform=`translateY(${(1-p)*40-q*24}px)`; c.style.filter=`blur(${(1-p)*10+q*10}px)`;});}
const IM=['n_coupage.jpg','n_eco.jpg','n_tins.jpg','n_ceramic.jpg','n_trio.jpg'];
const OP=['30% 50%','60% 50%','50% 50%','50% 45%','50% 50%'];
const C=IM.map((src,i)=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<img src="hq/${src}" style="object-position:${OP[i]}">`;$('cards').appendChild(d);return d;});
function render(t){
  const f=Math.floor(t*24); $('turb').setAttribute('seed',f%97); $('grain').style.transform=`translate(${(f*37)%60-30}px,${(f*53)%60-30}px)`;
  // intro 0..2.6
  word($('l1'),'Une nouvelle adresse',t,.15,2.3); word($('l2'),'pour l\'huile d\'olive.',t,.65,2.35);
  // cards 2.6..9.2
  const kOn=t>2.5&&t<9.4;
  $('kk').style.display=$('t1').style.display=kOn?'block':'none';
  if(kOn){ $('kk').textContent="Huile d'olive vierge extra"; $('kk').style.opacity=eo(prog(t,2.7,3.1))*(1-eo(prog(t,8.9,9.2)));
    if(t<5.9) word($('t1'),'Directement',t,2.7,5.5); else word($('t1'),"En Andalousie.",t,5.9,8.9);
    if(t<5.9 && t>=5.5){} }
  C.forEach((c,i)=>{const st=2.9+i*.95; const p=eb(prog(t,st,st+.7));
    const fan=(i-(C.length-1)/2); // final fan layout
    const spread=0; // after all in, fan out
    const gather=eio(prog(t,8.5,9.25));
    const x=lerp((i%2?1:-1)*900*(1-p), fan*120*spread, 1)*(1-gather);
    const y=(1-p)*300 + Math.abs(fan)*30*spread + gather*900;
    const r=lerp((i%2?18:-18)*(1-p)+(i-2.5)*2.5, fan*7*spread, spread);
    const s=lerp(.6,1,p)*lerp(1,.86,spread);
    c.style.display=t>=st-.05&&t<9.4?'block':'none'; c.style.zIndex=10+i;
    c.style.transform=`translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`; c.style.opacity=clamp(p*3);});
  // "en ligne" word between 3.7 and 5.5 handled by line 2
  if(t>2.9&&t<5.9){ const el=$('l2'); el.style.top='420px'; el.style.fontSize='104px'; word(el,'du producteur.',t,3.0,5.5);} else { $('l2').style.top='900px'; $('l2').style.fontSize='110px'; }
  // end 9.2..
  const eOn=t>=9.2; $('end').style.display=eOn?'flex':'none'; $('end').style.zIndex=50;
  if(eOn){ $('end').style.clipPath=`circle(${eio(prog(t,9.2,9.8))*120}% at 50% 50%)`;
    $('lg').style.clipPath=`inset(-10% ${(1-eio(prog(t,9.5,10.4)))*100}% -10% 0)`;
    [['u1',10.2],['u2',10.45],['u3',11.0]].forEach(([id,s])=>{const q=eo(prog(t,s,s+.6)); $(id).style.opacity=q; $(id).style.transform=`translateY(${(1-q)*24}px)`;});}
}
window.render=render; window.DURATION=DURATION; render(0);
</script></body></html>
