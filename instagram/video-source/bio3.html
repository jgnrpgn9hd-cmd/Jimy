<!doctype html><html lang="fr"><head><meta charset="utf-8"><link href="fonts/fonts.css" rel="stylesheet"><style>
:root{--cream:#F6F1E7;--ink:#1F241C;--olive:#4B523C;--gold:#A88B57;--gold2:#C9AE7C;--teal:#48A99A;--deep:#1B2619}
*{margin:0;padding:0;box-sizing:border-box}html,body{width:2160px;height:1920px;overflow:hidden;background:#000}
body{font-family:"Instrument Sans",sans-serif;color:var(--ink)}
.bg{position:absolute;inset:0;background:linear-gradient(#D6D3D4 0%,#D3CFD1 45%,#B9B3B4 100%)}
.ph{position:absolute;object-fit:cover;-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 62%,transparent 100%)}
.H{font-weight:700;text-transform:uppercase;letter-spacing:-.03em;line-height:.98}
.T{font-family:"Instrument Serif",serif;font-weight:400;letter-spacing:-.02em;line-height:.92}
.k{font-size:22px;letter-spacing:6px;text-transform:uppercase;font-weight:600}
.pill{position:absolute;display:flex;align-items:center;gap:12px;padding:14px 28px;border-radius:999px;font-size:28px;font-weight:500;letter-spacing:.5px;white-space:nowrap;background:rgba(255,255,255,.38)!important;color:var(--ink)!important;border:1px solid rgba(255,255,255,.7);backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.08)}
.pill i{width:10px;height:10px;border-radius:50%;background:#2F4A2A!important;font-size:0}
.cta{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:18px;padding:26px 54px;border-radius:999px;background:var(--deep);color:var(--cream);font-size:34px;font-weight:500;letter-spacing:1px;white-space:nowrap;box-shadow:0 24px 50px rgba(27,38,25,.35)}
.cta span{color:var(--gold2)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 55%,rgba(40,40,40,.18) 100%)}
</style></head><body>

<!-- POST -->
<div style="position:absolute;left:0;top:0;width:1080px;height:1350px;overflow:hidden">
 <div class="bg"></div>
 <img class="ph" src="hq/bio.jpg" style="left:-110px;top:360px;width:1300px;height:847px;object-position:50% 50%">
 <div class="vig"></div>
 <div style="position:absolute;left:0;right:0;top:80px;text-align:center">
  <div class="k" style="color:var(--olive)">Huile d'olive vierge extra</div>
  <div class="T" style="font-size:132px;margin-top:16px">L'or <span style="color:#2F4A2A">vert</span><br>d'Andalousie.</div></div>
 <div class="k" style="position:absolute;left:0;right:0;bottom:200px;text-align:center;color:var(--olive);font-size:21px">Écologique &nbsp;·&nbsp; Pressée à froid &nbsp;·&nbsp; Andalousie</div>
 <div class="cta" style="bottom:70px">jimenez-shop.com <span>→</span></div>
</div>

<!-- STORY -->
<div style="position:absolute;left:1080px;top:0;width:1080px;height:1920px;overflow:hidden">
 <div class="bg"></div>
 <img class="ph" src="hq/bio.jpg" style="left:-230px;top:640px;width:1540px;height:1003px;object-position:50% 50%">
 <div class="vig"></div>
 <div style="position:absolute;left:0;right:0;top:230px;text-align:center">
  <div class="k" style="color:var(--olive)">Huile d'olive vierge extra · Écologique</div>
  <div class="T" style="font-size:170px;margin-top:22px">L'or <span style="color:#2F4A2A">vert</span><br>d'Andalousie.</div></div>
 <div class="pill" style="left:40px;top:800px;background:var(--cream)"><i style="background:var(--gold);color:var(--cream)">✓</i>Écologique</div>
 <div class="pill" style="right:40px;top:1420px;background:var(--gold)"><i style="background:var(--ink);color:var(--gold2)">✓</i>Pressée à froid</div>
 <div class="pill" style="left:40px;top:1420px;background:var(--deep);color:var(--cream)"><i style="background:var(--gold2);color:var(--deep)">✓</i>Andalousie</div>
 <div class="cta" style="top:1590px">Découvrir <span>↓</span></div>
</div>
</body></html>
