<!doctype html><html lang="fr"><head><meta charset="utf-8"><link href="fonts/fonts.css" rel="stylesheet"><style>
:root{--cream:#F6F1E7;--ink:#1F241C;--olive:#4B523C;--gold:#A88B57;--gold2:#C9AE7C;--beige:#E6DDCE;--teal:#48A99A;--deep:#1B2619}
*{margin:0;padding:0;box-sizing:border-box}html,body{width:2160px;height:1920px;overflow:hidden;background:#000}
body{font-family:"Instrument Sans",sans-serif}
.H{font-weight:700;text-transform:uppercase;letter-spacing:-.025em;line-height:1.02}
.k{font-size:22px;letter-spacing:6px;text-transform:uppercase;font-weight:600}
.pill{position:absolute;display:flex;align-items:center;gap:16px;padding:20px 34px 20px 20px;border-radius:999px;font-size:36px;font-weight:600;letter-spacing:-.5px;box-shadow:0 18px 40px rgba(0,0,0,.3);white-space:nowrap}
.pill i{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:26px;font-weight:700}
</style></head><body>

<!-- POST 1080x1350 -->
<div id="post" style="position:absolute;left:0;top:0;width:1080px;height:1350px;overflow:hidden;background:var(--deep);color:var(--cream)">
 <img src="hq/bio.jpg" style="position:absolute;left:0;top:0;width:1080px;height:780px;object-fit:cover;object-position:52% 50%">
 <div style="position:absolute;left:0;top:0;width:1080px;height:790px;background:linear-gradient(to bottom,rgba(27,38,25,0) 55%,var(--deep) 100%)"></div>
  <div style="position:absolute;left:80px;top:730px;right:80px">
  <div class="k" style="color:var(--gold2);margin-bottom:26px">Certifiée bio · Andalousie</div>
  <div class="H" style="font-size:118px">Verte dedans,<br><span style="color:var(--gold2)">verte dehors.</span></div>
  <div style="font-size:40px;font-weight:500;margin-top:30px;color:var(--beige);letter-spacing:-.3px">Notre huile d'olive vierge extra bio,<br>dans sa bouteille verte.</div></div>
 <div style="position:absolute;left:80px;right:80px;bottom:70px;display:flex;justify-content:space-between;align-items:center">
  <img src="img/logo_cream.png" style="width:150px">
  <div class="k" style="font-size:20px;color:var(--gold2)">jimenez-shop.com</div></div>
</div>

<!-- STORY 1080x1920 -->
<div id="story" style="position:absolute;left:1080px;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--deep);color:var(--cream)">
 <div style="position:absolute;left:0;right:0;top:250px;text-align:center">
  <div class="k" style="color:var(--gold2);margin-bottom:28px">Huile d'olive vierge extra</div>
  <div class="H" style="font-size:150px;line-height:.98">La version<br><span style="color:var(--gold2)">bio.</span></div></div>
 <div style="position:absolute;left:60px;top:720px;width:960px;height:640px;border-radius:44px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.45)">
  <img src="hq/bio.jpg" style="width:100%;height:100%;object-fit:cover;object-position:52% 50%"></div>
 <div class="pill" style="left:40px;top:670px;background:var(--cream);color:var(--ink)"><i style="background:var(--gold);color:var(--cream)">✓</i>Certifiée bio</div>
 <div class="pill" style="right:40px;top:1320px;background:var(--gold);color:var(--ink)"><i style="background:var(--ink);color:var(--gold2)">✓</i>Pressée à froid</div>
 <div class="pill" style="left:40px;top:1320px;background:var(--teal);color:var(--cream)"><i style="background:var(--cream);color:var(--teal)">✓</i>D'Andalousie</div>
 <div style="position:absolute;left:0;right:0;top:1500px;text-align:center">
  <div style="font-size:44px;font-weight:600;letter-spacing:-.5px">Disponible sur jimenez-shop.com</div>
  <div style="font-size:60px;margin-top:26px;color:var(--gold2)">↓</div></div>
 <img src="img/logo_cream.png" style="position:absolute;left:50%;transform:translateX(-50%);top:120px;width:170px;opacity:.9">
</div>
</body></html>
