<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maison Oléane</title>
<meta name="description" content="Maison Oléane — décoration et objets pour la maison, pièce par pièce, à prix doux. Livraison offerte dès 49 €, retours sous 30 jours.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="announce" id="announce">Livraison offerte dès 49 €</div>
<header class="site">
  <div class="wrap">
    <div class="hdr-top">
      <div class="hdr-left">
        <button class="icon-btn menu-btn" data-menu aria-label="Ouvrir le menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M4 8h16M4 16h16"/></svg></button>
        <form class="search-form" id="searchForm" role="search">
          <label for="q" style="position:absolute;left:-9999px">Rechercher</label>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          <input id="q" type="search" placeholder="Rechercher un objet" autocomplete="off" aria-controls="qList" aria-expanded="false">
          <div class="qlist" id="qList" hidden></div>
        </form>
      </div>
      <button class="logo" data-go="home" aria-label="Maison Oléane, accueil"><small>Maison</small><span>Oléane</span></button>
      <div class="hdr-right">
        <button class="icon-btn" data-go="search" aria-label="Rechercher" style="display:none" id="mSearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
        <button class="icon-btn" data-go="page" data-p="contact" aria-label="Contact"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
        <button class="icon-btn" data-cart aria-label="Ouvrir le panier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M5 8h14l-1.2 11H6.2z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span class="count" id="count" hidden>0</span></button>
      </div>
    </div>
    <nav class="main" id="nav" aria-label="Menu principal"></nav>
  </div>
</header>

<main id="main"></main>

<footer class="site">
  <div class="wrap">
    <div class="cols">
      <div style="line-height:1"><span style="font-size:10.5px;letter-spacing:6px;text-transform:uppercase;color:var(--bg)">Maison</span><br><span style="font-family:var(--serif);font-size:38px;color:var(--bg)">Oléane</span><p style="line-height:1.6;margin-top:16px;max-width:240px">Des objets choisis pour la maison, pièce par pièce, à prix doux.</p></div>
      <div><strong>Service client</strong><button data-go="page" data-p="livraison">Livraison</button><button data-go="page" data-p="retours">Retours et remboursements</button><button data-go="page" data-p="faq">Questions fréquentes</button><button data-go="page" data-p="contact">Contact</button></div>
      <div><strong>La maison</strong><button data-go="page" data-p="histoire">Notre histoire</button><button data-go="page" data-p="journal">Le journal</button><button data-go="col" data-p="special:cadeaux">Idées cadeaux</button></div>
      <div><strong>Informations</strong><button data-go="page" data-p="cgv">CGV</button><button data-go="page" data-p="mentions">Mentions légales</button><button data-go="page" data-p="confidentialite">Confidentialité</button></div>
    </div>
    <div class="base"><span>© 2026 Maison Oléane</span><span>contact@maisonoleane.com · Paiement sécurisé : CB, Visa, Mastercard, PayPal, Apple Pay, 3x sans frais</span></div>
  </div>
</footer>

<div id="overlay"></div>
<div id="toast" class="toast" hidden role="status"></div>
<script src="app.js"></script>
</body>
</html>
